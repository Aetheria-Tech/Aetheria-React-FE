language: "ko"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: false
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
  base_branches:
    - ".*"

  path_instructions:
    - path: "src/pages/**/*.{ts,tsx}"
      instructions: "라우트 단위 상태와 화면 전환만 담당하는지, 서비스 호출 결과를 화면 흐름에 맞게 조합하는지 확인한다."
    - path: "src/components/**/*.{ts,tsx}"
      instructions: "재사용 가능한 props 기반 UI인지, 라우팅/인증/API 호출 같은 전역 흐름이 과도하게 섞이지 않았는지 확인한다."
    - path: "src/services/**/*.ts"
      instructions: "API 계약, 인증 세션, 토큰 갱신, 브라우저 저장소 접근 책임이 명확한지 확인한다. 백엔드에 없는 endpoint나 응답 필드를 추측하지 않는다."
    - path: "src/hooks/**/*.ts"
      instructions: "React 상태와 서비스 호출 조합이 명확한지, cleanup과 stale callback 방지가 충분한지 확인한다."
    - path: "src/lib/**/*.ts"
      instructions: "React에 의존하지 않는 순수 유틸리티인지, 사이드 이펙트가 불필요하게 섞이지 않았는지 확인한다."
    - path: "src/__tests__/**/*.{ts,tsx}"
      instructions: "사용자 흐름, API 매핑, 라우팅, 실패/로딩 상태를 검증하는지 확인한다. 테스트 삭제로 통과시키지 않는다."
    - path: "**/*.{yml,yaml,json,js,cjs,ts}"
      instructions: "프론트엔드 빌드, 테스트, lint 설정과 환경 변수 사용이 프로젝트 구조에 맞는지 확인한다."

  path_filters:
    - "!**/dist/**"
    - "!**/node_modules/**"
    - "!**/coverage/**"

chat:
  auto_reply: true

tone_instructions: "React, TypeScript, Vite, TailwindCSS 기반 프론트엔드 코드 기준으로 API 계약 준수, 사용자 흐름 안정성, 인증/토큰 처리, 테스트 가능성을 중점적으로 검토한다."

knowledge_base:
  opt_out: false
  learnings:
    scope: auto
  issues:
    scope: auto

code_generation:
  docstrings:
    language: "ko-KR"
